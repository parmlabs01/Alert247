publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  provider: ^6.1.2
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.3
  supabase_flutter: ^2.5.6
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  sensors_plus: ^5.0.1
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
